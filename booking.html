<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking Form</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->
    <header>
        <h2>IPL 2026 Ticket Booking</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="#booking">Book Tickets</a>
        </nav>
    </header>


    <!-- Booking Form -->
    <section class="booking" id="booking">

        <h2>Ticket Booking Form</h2>

        <form action="#" method="get">

            <!-- Name -->
            <label for="name">Full Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="30"
                required
            >


            <!-- Email -->
            <label for="email">Email Address:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                title="Enter a valid email address, example@gmail.com"
                required
            >


            <!-- Phone -->
            <label for="phone">Phone Number:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit mobile number"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                required
            >


            <!-- Match Selection -->
            <label for="match">Select Match:</label>

            <select id="match" name="match" required>

                <option value="">-- Select Match --</option>

                <option value="RCB vs CSK">RCB vs CSK</option>

                <option value="MI vs KKR">MI vs KKR</option>

                <option value="SRH vs DC">SRH vs DC</option>

                <option value="GT vs PBKS">GT vs PBKS</option>

            </select>


            <!-- Stand Category -->
            <label for="stand">Stand Category:</label>

            <select id="stand" name="stand" required>

                <option value="">-- Select Stand --</option>

                <option value="General">General</option>

                <option value="Premium">Premium</option>

                <option value="VIP">VIP</option>

            </select>


            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label>

            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                placeholder="Enter tickets (1-10)"
                required
            >


            <!-- Booking Preference -->
            <label>Booking Preference:</label>

            <div class="radio-group">

                <input
                    type="radio"
                    id="online"
                    name="preference"
                    value="Online"
                    required
                >

                <label for="online">Online</label>

                <input
                    type="radio"
                    id="counter"
                    name="preference"
                    value="Counter"
                >

                <label for="counter">Counter</label>

            </div>


            <!-- Submit and Reset -->
            <button type="submit">
                Submit Booking
            </button>

            <button type="reset" class="reset-btn">
                Reset
            </button>

        </form>

    </section>


    <!-- Footer -->
    <footer>

        <p>IPL 2026 Ticket Booking</p>

        <p>Thank you for choosing us!</p>

        <p>© 2026 All Rights Reserved</p>

    </footer>


</body>
</html>
